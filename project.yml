  PurgeSwipeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # CODE_SIGN_ENTITLEMENTS comes from the project-level xcconfig (app entitlements); a test bundle must not claim them.
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - target: PurgeSwipe

  PurgeSwipeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # CODE_SIGN_ENTITLEMENTS comes from the project-level xcconfig (app entitlements); a test bundle must not claim them.
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - target: PurgeSwipe

schemes:
  # Dev owns the test targets; every scheme archives with its Release-* config.
  PurgeSwipe-Dev:
    build:
      targets:
        PurgeSwipe: all
        PurgeSwipeTests: [test]
        PurgeSwipeUITests: [test]
    run:
      config: Debug-Dev
      storeKitConfiguration: App/StoreKit/Products.storekit
    test:
      config: Debug-Dev
      gatherCoverageData: true
      coverageTargets:
        - PurgeSwipe
      targets:
        - PurgeSwipeTests
        - PurgeSwipeUITests
    profile:
      config: Release-Dev
    analyze:
      config: Debug-Dev
    archive:
      config: Release-Dev
  PurgeSwipe-Staging:
    build:
      targets:
        PurgeSwipe: all
    run:
      config: Debug-Staging
    profile:
      config: Release-Staging
    analyze:
      config: Debug-Staging
    archive:
      config: Release-Staging
  PurgeSwipe:
    build:
      targets:
        PurgeSwipe: all
    run:
      config: Debug-Prod
    profile:
      config: Release-Prod
    analyze:
      config: Debug-Prod
    archive:
      config: Release-Prod
