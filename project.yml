name: PurgeSwipe
options:
  bundleIdPrefix: com.iletai
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: vi

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Lets Xcode extract String(localized:)/Text keys into the string catalogs.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

configs:
  Debug-Dev: debug
  Release-Dev: release
  Debug-Staging: debug
  Release-Staging: release
  Debug-Prod: debug
  Release-Prod: release

# One xcconfig per environment; contract in skill ios-new-app references/environments.md.
configFiles:
  Debug-Dev: Config/Dev.xcconfig
  Release-Dev: Config/Dev.xcconfig
  Debug-Staging: Config/Staging.xcconfig
  Release-Staging: Config/Staging.xcconfig
  Debug-Prod: Config/Prod.xcconfig
  Release-Prod: Config/Prod.xcconfig

# Own libraries (versions + integration snippets): skill `iletai-libs`; new_app.sh --with adds them here.
packages:
  BaseNavigationStack:
    url: https://github.com/iletai/BaseNavigationStack.git
    from: 2.1.0
  AppUpdateKit:
    url: https://github.com/iletai/AppUpdateKit.git
    from: 1.2.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.12.0

targets:
  PurgeSwipe:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        # Own variable: a project-level PRODUCT_BUNDLE_IDENTIFIER would also give the test bundles the app's id.
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Debug-* keep DEBUG on top of the env condition from the xcconfig (partial match on config name).
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
    dependencies:
      - package: BaseNavigationStack
      - package: AppUpdateKit
      - package: GoogleMobileAds
    info:
      path: App/Info.plist
      properties:
        # Xcode silently drops INFOPLIST_KEY_<custom> build settings, so every custom key lives here.
        UILaunchScreen: {}
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only Apple's built-in encryption; avoids "Missing Compliance" on every build.
        ITSAppUsesNonExemptEncryption: false
        # Store page for update prompts / share links; empty until the ASC record exists.
        APP_STORE_URL: $(APP_STORE_URL)
        # dev | staging | prod, read by AppConfiguration.environment.
        APP_ENV: $(APP_ENV)
        # In-app legal/support links (apps-site). Literal URLs here: xcconfig would cut them at "//".
        SUPPORT_EMAIL: $(SUPPORT_EMAIL)
        PRIVACY_POLICY_URL: https://apps-site-six.vercel.app/apps/purgeswipe/privacy
        SUPPORT_URL: https://apps-site-six.vercel.app/apps/purgeswipe/support
        TERMS_OF_USE_URL: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/
        NSHumanReadableCopyright: "© 2026 iletai"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Subscription group of this environment's ASC record (Dev: same id as App/StoreKit/Products.storekit).
        SUBSCRIPTION_GROUP_ID: $(SUBSCRIPTION_GROUP_ID)
        MICROCMS_API_KEY: $(MICROCMS_API_KEY)
        MICROCMS_SERVICE_DOMAIN: $(MICROCMS_SERVICE_DOMAIN)
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        NSUserTrackingUsageDescription: "Cho phép theo dõi để quảng cáo phù hợp hơn với bạn. Bạn vẫn dùng đầy đủ tính năng nếu từ chối."
