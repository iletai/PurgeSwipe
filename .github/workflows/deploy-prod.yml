name: Deploy Prod (App Store)

on:
  # Annotated tag x.y.z on the main merge commit (no v prefix).
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      submit:
        description: Submit for review after upload
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Prod ships only commits that went through release/hotfix -> main (see references/git-flow.md).
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      # The tag is the version that ships; a tag that disagrees with the branch is a release mistake.
      - name: Tag matches MARKETING_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^MARKETING_VERSION *= *//p' Config/Shared.xcconfig | head -1 | tr -d ' ')
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != MARKETING_VERSION ${v:-<missing>} in Config/Shared.xcconfig"; exit 1; }

  deploy:
    needs: guard
    uses: iletai/ios-shared/.github/workflows/ios-appstore.yml@main
    with:
      environment: prod
      xcode-version: latest-stable
      submit: ${{ inputs.submit == true }}
      xcconfig-secrets: MICROCMS_API_KEY
    secrets: inherit
